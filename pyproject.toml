[project]
name = "learning-accelerator"
version = "0.1.0"
description = "A multi-agent learning system that plans, teaches, quizzes, and coaches from your own notes."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gamal Osama" },
]
keywords = ["agents", "langgraph", "crewai", "a2a", "litellm", "education"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]

dependencies = [
    "langgraph==1.1.0",
    "langgraph-checkpoint==3.0.1",
    "langgraph-checkpoint-sqlite==3.0.3",
    "langgraph-checkpoint-postgres==3.0.1",
    "langchain==1.2.11",
    "langchain-core==1.6.12",
    "langchain-openai==1.0.3",
    "mcp==1.26.0",
    "a2a-sdk==0.3.25",
    "crewai==1.13.0",
    "langfuse==4.0.1",
    "openai==2.8.0",
    "litellm==1.82.4",
    "fastapi==0.120.1",
    "uvicorn==0.34.0",
    "streamlit==1.43.2",
    "pydantic==2.11.9",
    "python-dotenv==1.1.1",
    "tenacity==8.5.0",
]

[dependency-groups]
dev = [
    "deepeval==3.9.1",
    "pytest==8.3.0",
    "pytest-asyncio==0.25.0",
]

[tool.uv]
# This is an application, not an installable library: dependencies are
# installed into the project environment without building a wheel.
package = false

[tool.pytest.ini_options]
# Add src/ to Python path so tests can import from graph, agents, etc.
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

# Skip eval tests by default, they require Ollama running.
# Run all tests:        pytest tests/
# Run unit tests only:  pytest tests/ -m "not eval"
# Run eval tests only:  pytest tests/test_eval.py -m eval -s
addopts = "-m 'not eval'"

# Test markers, keeps fast and slow tests clearly separated
markers = [
    "unit: fast tests, no external dependencies",
    "eval: slow evaluation tests requiring Ollama (LLM-as-judge)",
]

[tool.pyright]
pythonPath = "src"
